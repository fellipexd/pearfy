name: Pearfy quality and performance

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  release-build:
    name: Release build (${{ matrix.os }})
    # Temporarily compile-only while the Swift 6.2 test-runner failures are investigated.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-swift-6.2-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-6.2-
      - name: Build release products
        run: swift build -c release

  benchmark-report:
    name: Non-blocking HTTP benchmark report
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    continue-on-error: true
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - name: Capture benchmark and environment metadata
        run: |
          bash scripts/benchmark-http.sh --runs 5 --http-requests 1000 \
            > "$RUNNER_TEMP/http-benchmark.csv" \
            2> "$RUNNER_TEMP/http-benchmark-metadata.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pearfy-http-benchmark-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/http-benchmark.csv
            ${{ runner.temp }}/http-benchmark-metadata.txt
