name: Pearfy quality and performance

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  unit:
    name: Release build and unit tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-swift-6.2-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-6.2-
      - name: Build release products
        run: swift build -c release
      - name: Run unit suite
        run: bash scripts/test-unit.sh -c release

  integration-linux:
    name: PostgreSQL and Redis integration tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pearfy-test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-swift-6.2-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-6.2-
      - name: Build release products
        run: swift build -c release
      - name: Run real adapter integrations
        env:
          PEARFY_TEST_POSTGRES_HOST: 127.0.0.1
          PEARFY_TEST_POSTGRES_PORT: 5432
          PEARFY_TEST_POSTGRES_USER: postgres
          PEARFY_TEST_POSTGRES_PASSWORD: pearfy-test
          PEARFY_TEST_POSTGRES_DATABASE: postgres
          PEARFY_TEST_REDIS_HOST: 127.0.0.1
          PEARFY_TEST_REDIS_PORT: 6379
        run: bash scripts/test-integrations.sh -c release

  benchmark-report:
    name: Non-blocking HTTP benchmark report
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    continue-on-error: true
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - name: Capture benchmark and environment metadata
        run: |
          bash scripts/benchmark-http.sh --runs 5 --http-requests 1000 \
            > "$RUNNER_TEMP/http-benchmark.csv" \
            2> "$RUNNER_TEMP/http-benchmark-metadata.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pearfy-http-benchmark-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/http-benchmark.csv
            ${{ runner.temp }}/http-benchmark-metadata.txt
